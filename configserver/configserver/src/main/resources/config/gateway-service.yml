server:
  port: 8080   # Port on which the API Gateway will run

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka   # URL of the Eureka Server

spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          # Keycloak JWK endpoint used to validate JWT tokens
          jwk-set-uri: http://localhost:8181/realms/fitness-realm/protocol/openid-connect/certs

  cloud:
    gateway:
      routes:
        # Route for User Service
        - id: user-service   # Unique identifier for this route
          uri: lb://USER-SERVICE   # Service name registered in Eureka
          predicates:
            - Path=/api/users/**   # Forward requests matching /api/users/**

        # Route for Activity Service
        - id: activity-service   # Unique identifier for this route
          uri: lb://ACTIVITY-SERVICE   # Service name registered in Eureka
          predicates:
            - Path=/api/activities/**   # Forward requests matching /api/activities/**

        # Route for AI Service
        - id: ai-service   # Unique identifier for this route
          uri: lb://AI-SERVICE   # Service name registered in Eureka
          predicates:
            - Path=/api/ai/**   # Forward requests matching /api/ai/**