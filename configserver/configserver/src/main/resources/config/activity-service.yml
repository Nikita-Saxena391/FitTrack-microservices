server:
  port: 8082

spring:
  application:
    name: activity-service

  data:
    mongodb:
      uri:  YOUR_MONGODB_ATLAS_URI
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

  instance:
    prefer-ip-address: true

rabbitmq:
  exchange:
    name: activity-exchange
  queue:
    name: activityQueue
  routing:
    key: activity-routing-key